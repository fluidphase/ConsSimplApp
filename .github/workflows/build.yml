name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project.zip (if present)
        run: if [ -f project.zip ]; then unzip -qo project.zip; fi
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - name: Add google-services.json (optional)
        env: {GS: '${{ secrets.GOOGLE_SERVICES_JSON }}'}
        run: if [ -n "$GS" ]; then echo "$GS" > android/app/google-services.json; fi
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: Constellate-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
        
